<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070809"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Tasklynx</title><style>:root{--bg:#070809;--panel:#101216;--panel2:#15171c;--fg:#f5f5f5;--muted:#8f949e;--accent:#ff453a;--line:#282b31;--green:#45d483;--yellow:#ffcc4d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#20100f 0,transparent 32%),var(--bg);color:var(--fg);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}button{cursor:pointer}button:hover{border-color:var(--accent)}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;background:#090a0c}.brand{font-size:18px;font-weight:800;margin-bottom:25px}.dot{color:var(--accent)}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;border:0}.nav button.active{background:var(--panel2);border:1px solid var(--line)}.main{min-width:0}.top{position:sticky;top:0;z-index:5;backdrop-filter:blur(16px);background:#070809dd;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center}.search{flex:1}.content{padding:20px;max-width:1600px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.eyebrow{color:var(--accent);font-size:12px}.hero h1{margin:5px 0;font-size:clamp(24px,4vw,42px)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col{background:rgba(16,18,22,.82);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:280px}.col h3{font-size:13px;margin:4px 4px 12px}.task{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px}.task:hover{border-color:#555b66}.task-title{font-weight:700}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:11px}.pill{border:1px solid var(--line);padding:3px 6px;border-radius:999px}.urgent{color:var(--accent)}.done{color:var(--green)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.dialog{width:min(650px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.form{display:grid;gap:10px}.form label{display:grid;gap:6px;color:var(--muted)}.form textarea{min-height:110px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.footer{padding:30px 0;color:var(--muted);font-size:11px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:sticky;top:0;z-index:10;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.brand{margin:0 0 8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.content{padding:14px}.hero{align-items:flex-start;flex-direction:column}.top{padding:10px 12px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.search{flex-basis:100%;order:2}.hero h1{font-size:28px}.toolbar>*{flex:1;min-width:130px}.row{flex-direction:column}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="dot">●</span> TASKLYNX</div><div class="nav"><button class="active" onclick="filter('all')">[all tasks]</button><button onclick="filter('todo')">[todo]</button><button onclick="filter('doing')">[doing]</button><button onclick="filter('done')">[done]</button><button onclick="today()">[today]</button><button onclick="stats()">[stats]</button></div></aside><main class="main"><header class="top"><input id="search" class="search" placeholder=": search tasks  •  Ctrl/⌘ K" oninput="render()"><button onclick="openNew()">+ add</button><button onclick="location.reload()">↻</button></header><section class="content"><div class="hero"><div><div class="eyebrow">LOCAL / DEVELOPER WORKSPACE</div><h1>Tasklynx<span class="dot">_</span></h1><div class="muted" id="branch">branch: loading</div></div><div><button onclick="exportData('json')">json</button> <button onclick="exportData('md')">markdown</button></div></div><div class="grid" id="stats"></div><div class="toolbar"><select id="project" onchange="render()"><option value="">all projects</option></select><select id="priority" onchange="render()"><option value="">all priorities</option><option>urgent</option><option>high</option><option>normal</option><option>low</option></select><select id="sort" onchange="render()"><option value="updated">recent</option><option value="priority">priority</option><option value="due">deadline</option></select></div><div class="board" id="board"></div><div class="footer">tasklynx • local-first • terminal-native • press <b>n</b> to add, <b>?</b> for shortcuts</div></section></main></div><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">new task</h2><form class="form" onsubmit="saveTask(event)"><input type="hidden" id="id"><label>title<input id="title" required></label><label>description<textarea id="description"></textarea></label><div class="row"><label>project<input id="projectInput" value="default"></label><label>priority<select id="priorityInput"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select></label></div><div class="row"><label>tags<input id="tags" placeholder="bug,backend"></label><label>deadline<input id="due" type="date"></label></div><div class="row"><button type="button" onclick="closeModal()">cancel</button><button type="submit">save task</button></div></form></div></div><script>let data={tasks:[],current_branch:'main'};let view='all';async function load(){data=await fetch('/api/tasks').then(r=>r.json());document.querySelector('#branch').textContent='branch: '+data.current_branch;let ps=[...new Set(data.tasks.map(t=>t.project).filter(Boolean))];document.querySelector('#project').innerHTML='<option value="">all projects</option>'+ps.map(p=>`<option>${p}</option>`).join('');render()}function filter(v){view=v;render()}function render(){let q=document.querySelector('#search').value.toLowerCase(),p=document.querySelector('#project').value,pri=document.querySelector('#priority').value,sort=document.querySelector('#sort').value;let ts=data.tasks.filter(t=>(view==='all'||t.status===view)&&(!p||t.project===p)&&(!pri||t.priority===pri)&&(!q||[t.title,t.description,t.project,...(t.tags||[])].join(' ').toLowerCase().includes(q)));ts.sort((a,b)=>sort==='priority'?rank(b.priority)-rank(a.priority):sort==='due'?(a.due||'9999').localeCompare(b.due||'9999'):b.updated_at.localeCompare(a.updated_at));document.querySelector('#board').innerHTML=['todo','doing','done'].map(s=>`<div class="col" ondragover="event.preventDefault()" ondrop="drop(event,'${s}')"><h3>${s.toUpperCase()} <span class="muted">${ts.filter(t=>t.status===s).length}</span></h3>${ts.filter(t=>t.status===s).map(card).join('')}</div>`).join('');let done=data.tasks.filter(t=>t.status==='done').length;document.querySelector('#stats').innerHTML=`<div class="stat"><div class="muted">TOTAL</div><b>${data.tasks.length}</b></div><div class="stat"><div class="muted">OPEN</div><b>${data.tasks.length-done}</b></div><div class="stat"><div class="muted">DONE</div><b class="done">${done}</b></div>`}function rank(x){return {urgent:4,high:3,normal:2,low:1}[x]||0}function card(t){return `<article class="task" draggable="true" ondragstart="event.dataTransfer.setData('id','${t.id}')" onclick="edit('${t.id}')"><div class="task-title">${esc(t.title)}</div><div class="meta"><span class="pill ${t.priority==='urgent'?'urgent':''}">${t.priority}</span><span class="pill">${esc(t.project)}</span>${(t.tags||[]).map(x=>`<span class="pill">#${esc(x)}</span>`).join('')}${t.due?`<span class="pill">due ${t.due.slice(0,10)}</span>`:''}</div></article>`}async function drop(e,status){let id=e.dataTransfer.getData('id'),t=data.tasks.find(x=>x.id===id);if(!t)return;t.status=status;if(status==='done')t.completed_at=new Date().toISOString();t.updated_at=new Date().toISOString();await put(t);render()}function openNew(){document.querySelector('#id').value='';document.querySelector('#title').value='';document.querySelector('#description').value='';document.querySelector('#projectInput').value='default';document.querySelector('#priorityInput').value='normal';document.querySelector('#tags').value='';document.querySelector('#due').value='';document.querySelector('#modalTitle').textContent='new task';document.querySelector('#modal').classList.add('open')}function edit(id){let t=data.tasks.find(x=>x.id===id);document.querySelector('#id').value=t.id;document.querySelector('#title').value=t.title;document.querySelector('#description').value=t.description||'';document.querySelector('#projectInput').value=t.project||'default';document.querySelector('#priorityInput').value=t.priority;document.querySelector('#tags').value=(t.tags||[]).join(',');document.querySelector('#due').value=t.due?t.due.slice(0,10):'';document.querySelector('#modalTitle').textContent='edit task';document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}async function saveTask(e){e.preventDefault();let id=document.querySelector('#id').value,t=data.tasks.find(x=>x.id===id)||{id:crypto.randomUUID(),title:'',description:'',project:'default',tags:[],status:'todo',priority:'normal',due:null,branch:data.current_branch,commit:null,parent:null,estimate_minutes:null,created_at:new Date().toISOString(),updated_at:new Date().toISOString(),completed_at:null};Object.assign(t,{title:document.querySelector('#title').value,description:document.querySelector('#description').value,project:document.querySelector('#projectInput').value,priority:document.querySelector('#priorityInput').value,tags:document.querySelector('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),due:document.querySelector('#due').value?document.querySelector('#due').value+'T23:59:59Z':null,updated_at:new Date().toISOString()});if(!id){data.tasks.push(t);await fetch('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(t)})}else await put(t);closeModal();render()}async function put(t){await fetch('/api/tasks/'+t.id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(t)})}function exportData(f){let text=f==='md'?markdown():JSON.stringify(data,null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='tasklynx.'+(f==='md'?'md':'json');a.click()}function markdown(){return '# Tasklynx\n\n'+['todo','doing','done'].map(s=>'## '+s+'\n'+data.tasks.filter(t=>t.status===s).map(t=>`- [${s==='done'?'x':' '}] ${t.title}`).join('\n')).join('\n\n')}function today(){view='all';document.querySelector('#search').value='';let d=new Date().toISOString().slice(0,10);document.querySelector('#board');render();alert('Today: '+data.tasks.filter(t=>t.due&&t.due.slice(0,10)===d).length+' task(s)')}function stats(){alert(`${data.tasks.length} tasks • ${data.tasks.filter(t=>t.status==='done').length} done • ${data.tasks.filter(t=>t.overdue).length} overdue`)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#search').focus()}if(e.key==='n'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA')openNew();if(e.key==='Escape')closeModal()});load()</script></body></html>
