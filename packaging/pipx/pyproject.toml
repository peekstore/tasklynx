[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklynx"
version = "0.0.1b2"
description = "Developer-first local task manager with Git-style workflows and terminal dashboard"
readme = "README.md"
authors = [{ name = "RK Riad Khan", email = "rkriad585@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
keywords = ["tasks", "todo", "kanban", "cli", "tui", "developer-tools"]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://peekstore.github.io/tasklynx"
Documentation = "https://peekstore.github.io/tasklynx/"
Repository = "https://github.com/peekstore/tasklynx"
"Author Website" = "https://rkriad585.github.io"

[project.scripts]
tasklynx = "tasklynx.cli:main"
tx = "tasklynx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tasklynx*"]
