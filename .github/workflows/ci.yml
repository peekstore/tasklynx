name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify version consistency
        run: |
          v_dot=$(tr -d '[:space:]' < .version)
          v_cargo=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$v_dot" != "$v_cargo" ]; then
            echo "Version mismatch: .version ($v_dot) != Cargo.toml ($v_cargo)"
            exit 1
          fi
          echo "Version consistent: $v_dot"

  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --verbose

  msrv:
    name: MSRV (Rust 1.75.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo check --all-targets
