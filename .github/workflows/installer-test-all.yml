name: Installer Test All

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  macos-latest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  windows-latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.ps1
        shell: pwsh
        run: |
          $p = "$env:TEMP\tu$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          $env:USERPROFILE = $p
          .\installer.ps1
          $env:PATH = "$env:USERPROFILE\.config\peekstore\tasklynx\bin;$env:PATH"
          tasklynx --version
          tx --version

  termux-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android ABI artifact selection
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/fakebin"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            printf '#!/bin/sh\necho "%s"\n' "$abi" > "$RUNNER_TEMP/fakebin/getprop"
            chmod +x "$RUNNER_TEMP/fakebin/getprop"
            out=$(PATH="$RUNNER_TEMP/fakebin:$PATH" TERMUX_VERSION=1 DRY_RUN=1 sh ./installer.sh | tail -1)
            echo "abi=$abi -> $out"
            test "$out" = "tasklynx-android-$abi"
          done

  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Test Nix flake run
        run: |
          nix --extra-experimental-features "nix-command flakes" \
            run github:peekstore/tasklynx -- --version 2>&1 | tail -5 || true
