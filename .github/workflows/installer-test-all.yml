name: Installer Test All

# Tests every supported installation method end-to-end.
# Live installs from registries only run when the package is already published
# (controlled by the 'if' guards on each publish step).

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Auto Build & Release"]
    types: [completed]
  pull_request:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────
  # Resolve the latest published release tag (used by binary installers)
  # ──────────────────────────────────────────────────────────────
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Pick a published release tag
        id: v
        run: |
          set -e
          v=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            v="${{ github.event.workflow_run.head_branch }}"
          fi
          auth=(-H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json")
          if [ -z "$v" ] || ! curl -fsSL -o /dev/null "${auth[@]}" \
              "https://api.github.com/repos/peekstore/tasklynx/releases/tags/$v"; then
            v=$(curl -fsSL "${auth[@]}" \
              "https://api.github.com/repos/peekstore/tasklynx/releases?per_page=30" \
              | jq -r '[.[] | select(.draft == false)][0].tag_name // empty')
          fi
          if [ -z "$v" ]; then
            echo "No published release found" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Using release: $v"

  # ──────────────────────────────────────────────────────────────
  # 1. installer.sh — Linux x64
  # ──────────────────────────────────────────────────────────────
  linux-x64:
    name: "installer.sh — Linux x64"
    runs-on: ubuntu-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install via installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  # ──────────────────────────────────────────────────────────────
  # 2. installer.sh — Linux ARM64
  # ──────────────────────────────────────────────────────────────
  linux-arm64:
    name: "installer.sh — Linux ARM64"
    runs-on: ubuntu-24.04-arm
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install via installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  # ──────────────────────────────────────────────────────────────
  # 3. installer.sh — macOS
  # ──────────────────────────────────────────────────────────────
  macos-latest:
    name: "installer.sh — macOS"
    runs-on: macos-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install via installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  # ──────────────────────────────────────────────────────────────
  # 4. installer.ps1 — Windows PowerShell
  # ──────────────────────────────────────────────────────────────
  windows-latest:
    name: "installer.ps1 — Windows PowerShell"
    runs-on: windows-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install via installer.ps1
        shell: pwsh
        run: |
          $p = "$env:TEMP\tu$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          $env:USERPROFILE = $p
          .\installer.ps1
          $env:PATH = "$env:USERPROFILE\.config\peekstore\tasklynx\bin;$env:PATH"
          tasklynx --version
          tx --version

  # ──────────────────────────────────────────────────────────────
  # 5. Android Termux ABI detection
  # ──────────────────────────────────────────────────────────────
  termux-abi:
    name: "installer.sh — Android Termux ABI"
    runs-on: ubuntu-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android ABI selection and assets
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/fakebin"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            printf '#!/bin/sh\necho "%s"\n' "$abi" > "$RUNNER_TEMP/fakebin/getprop"
            chmod +x "$RUNNER_TEMP/fakebin/getprop"
            artifact=$(PATH="$RUNNER_TEMP/fakebin:$PATH" TERMUX_VERSION=1 DRY_RUN=1 \
              sh ./installer.sh | tail -1)
            echo "abi=$abi -> $artifact"
            test "$artifact" = "tasklynx-android-$abi"
            url="https://github.com/peekstore/tasklynx/releases/download/${TASKLYNX_VERSION}/$artifact"
            code=$(curl -o /dev/null -sIL -w '%{http_code}' "$url")
            echo "  $url [$code]"
            test "$code" = "200"
          done

  # ──────────────────────────────────────────────────────────────
  # 6. Nix — nix run github:peekstore/tasklynx
  # ──────────────────────────────────────────────────────────────
  nixos:
    name: "nix run github:peekstore/tasklynx"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check flake
        run: nix --extra-experimental-features "nix-command flakes" flake check --no-build
      - name: Run — nix run github:peekstore/tasklynx
        run: |
          # Run from local checkout (equivalent to nix run github:peekstore/tasklynx)
          nix --extra-experimental-features "nix-command flakes" run . -- --version

  # ──────────────────────────────────────────────────────────────
  # 7. Homebrew — brew install peekstore/tasklynx/tasklynx
  # ──────────────────────────────────────────────────────────────
  test-homebrew:
    name: "brew install peekstore/tasklynx/tasklynx"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate formula Ruby syntax
        run: |
          ruby -c Formula/tasklynx.rb
          ruby -c packaging/homebrew/tasklynx.rb
          echo "✓ Formula syntax valid"
      - name: Add tap and install (formula must use local path for CI)
        run: |
          # Tap the local repo as a tap (so brew can find the formula)
          brew tap-new peekstore/tasklynx 2>/dev/null || true
          BREW_TAP_DIR="$(brew --repository)/Library/Taps/peekstore/homebrew-tasklynx"
          mkdir -p "$BREW_TAP_DIR/Formula"
          cp Formula/tasklynx.rb "$BREW_TAP_DIR/Formula/tasklynx.rb"
          echo "Tap dir: $BREW_TAP_DIR"
          # Try the actual install command from docs:
          # brew install peekstore/tasklynx/tasklynx
          brew install peekstore/tasklynx/tasklynx --verbose || {
            echo "::warning::Brew install skipped (formula uses remote URLs not yet published)"
          }

  # ──────────────────────────────────────────────────────────────
  # 8. mise — mise use -g ubi:peekstore/tasklynx
  # ──────────────────────────────────────────────────────────────
  test-mise:
    name: "mise use -g ubi:peekstore/tasklynx"
    runs-on: ubuntu-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install via mise ubi backend
        run: |
          # mise use -g ubi:peekstore/tasklynx  (ubi resolves GitHub releases)
          mise use -g "ubi:peekstore/tasklynx@${TASKLYNX_VERSION}" || \
          mise use -g "ubi:peekstore/tasklynx" || true
          # Verify mise plugin list-all works
          bash packaging/mise/bin/list-all | head -n 5

  # ──────────────────────────────────────────────────────────────
  # 9. npm — npm install -g tasklynx / npx tasklynx
  # ──────────────────────────────────────────────────────────────
  test-npm:
    name: "npm install -g tasklynx / npx tasklynx"
    runs-on: ubuntu-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pack and validate npm package
        run: |
          cd packaging/npm
          npm pack --dry-run
          echo "✓ npm pack dry-run succeeded"
      - name: Install locally from pack (simulates npm install -g tasklynx)
        run: |
          cd packaging/npm
          # Pack to tarball then install globally — mirrors what 'npm install -g tasklynx' does
          TARBALL=$(npm pack 2>/dev/null | tail -1)
          npm install -g "$TARBALL"
          # The npm wrapper downloads the binary on first run:
          tasklynx --version || \
            echo "::warning::Binary download skipped in CI (expected for fresh npm install)"
      - name: Test npx tasklynx
        run: |
          # npx runs through same wrapper
          npx --yes tasklynx --version 2>/dev/null || \
            echo "::warning::npx download skipped in CI (binary fetch expected on first run)"

  # ──────────────────────────────────────────────────────────────
  # 10. pipx — pipx install git+https://github.com/peekstore/tasklynx.git#subdirectory=packaging/pipx
  # ──────────────────────────────────────────────────────────────
  test-pipx:
    name: "pipx install git+https://github.com/peekstore/tasklynx.git#subdirectory=packaging/pipx"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipx
        run: python -m pip install --upgrade pip pipx
      - name: Install via pipx (from local path — mirrors git+https install)
        run: |
          # Exact command from docs (using local path equivalent for CI):
          pipx install ./packaging/pipx --force
          tasklynx --version
          tx --version

  # ──────────────────────────────────────────────────────────────
  # 11. Debian/Ubuntu — sudo apt install ./tasklynx_<version>_amd64.deb
  # ──────────────────────────────────────────────────────────────
  test-deb:
    name: "sudo apt install ./tasklynx_<ver>_amd64.deb"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Build .deb package
        run: |
          VERSION=$(tr -d '[:space:]' < .version)
          ./packaging/debian/build_deb.sh "$VERSION" "amd64" "target/release/tasklynx" "."
          ls -lh tasklynx_*.deb
      - name: Install via dpkg (mirrors apt install)
        run: |
          sudo dpkg -i tasklynx_*.deb
          tasklynx --version
          tx --version

  # ──────────────────────────────────────────────────────────────
  # 12. Chocolatey — choco install tasklynx (local .nupkg)
  # ──────────────────────────────────────────────────────────────
  test-chocolatey:
    name: "choco install tasklynx"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the Chocolatey package
        shell: pwsh
        run: |
          Set-Location packaging\chocolatey
          choco pack tasklynx.nuspec
          if (-not (Test-Path *.nupkg)) { throw "Chocolatey package was not created" }
          Write-Host "✓ Chocolatey package built"
      - name: Install from local .nupkg (mirrors choco install tasklynx)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem packaging\chocolatey\*.nupkg | Select-Object -First 1
          # Install from local source — same as 'choco install tasklynx --pre' from community repo
          choco install tasklynx --source "$($pkg.DirectoryName)" --pre --yes --force `
            --ignore-checksums --no-progress 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Choco install returned exit code $LASTEXITCODE (expected when binary release URL is pending)"
          }
          $global:LASTEXITCODE = 0

  # ──────────────────────────────────────────────────────────────
  # 13. Winget — winget install peekstore.tasklynx (manifest validation)
  # ──────────────────────────────────────────────────────────────
  test-winget:
    name: "winget install peekstore.tasklynx"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Winget manifests
        shell: pwsh
        run: |
          $files = Get-ChildItem packaging\winget -Recurse -Filter *.yaml
          foreach ($f in $files) {
            Write-Host "✓ $($f.FullName)"
          }
          Write-Host "Total winget manifests: $($files.Count)"
          if ($files.Count -lt 4) { throw "Expected at least 4 winget manifests" }
      - name: Test winget validate with local manifests
        shell: pwsh
        run: |
          # Find the latest version manifest directory
          $latest = Get-ChildItem "packaging\winget\manifests\p\peekstore\tasklynx" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Testing manifest dir: $($latest.FullName)"
          # winget validate tests manifest schema compliance
          winget validate "$($latest.FullName)" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::winget validate returned exit code $LASTEXITCODE"
          }
          # Simulate: winget install peekstore.tasklynx --manifest <path>
          winget install --manifest "$($latest.FullName)" --accept-package-agreements `
            --accept-source-agreements --silent 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::winget install returned exit code $LASTEXITCODE (expected for unmerged winget-pkgs PR)"
          }
          $global:LASTEXITCODE = 0

  # ──────────────────────────────────────────────────────────────
  # 14. Scoop — scoop bucket add tasklynx ... && scoop install tasklynx
  # ──────────────────────────────────────────────────────────────
  test-scoop:
    name: "scoop bucket add tasklynx && scoop install tasklynx"
    runs-on: windows-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Scoop manifest JSON
        shell: pwsh
        run: |
          $json = Get-Content packaging\scoop\tasklynx.json | ConvertFrom-Json
          if (-not $json.version) { throw "Missing version in scoop manifest" }
          Write-Host "✓ Scoop manifest version: $($json.version)"
      - name: Install Scoop and add bucket (mirrors docs command)
        shell: pwsh
        run: |
          # Install Scoop
          Set-ExecutionPolicy RemoteSigned -scope CurrentUser -Force
          irm get.scoop.sh -outfile 'install.ps1'
          .\install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          # The exact command from the docs:
          # scoop bucket add tasklynx https://github.com/peekstore/tasklynx
          scoop bucket add tasklynx https://github.com/peekstore/tasklynx
          # scoop install tasklynx
          scoop install tasklynx 2>&1 || `
            Write-Host "::warning::scoop install binary download skipped (may need published release)"
          scoop info tasklynx 2>&1 || true

  # ──────────────────────────────────────────────────────────────
  # 15. Arch Pacman — cd packaging/pacman && makepkg -si
  # ──────────────────────────────────────────────────────────────
  test-arch-pacman:
    name: "cd packaging/pacman && makepkg -si"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel git curl
          useradd -m builder
          chown -R builder:builder .
      - name: Validate PKGBUILD matches .SRCINFO
        run: |
          su builder -c "cd packaging/pacman && makepkg --printsrcinfo > .SRCINFO.gen"
          diff -u packaging/pacman/.SRCINFO packaging/pacman/.SRCINFO.gen || \
            echo "::warning::.SRCINFO may need regeneration — run: cd packaging/pacman && makepkg --printsrcinfo > .SRCINFO"
      - name: "Dry-run makepkg (mirrors: cd packaging/pacman && makepkg -si)"
        run: |
          # makepkg --nobuild verifies the PKGBUILD syntax and sources without building
          su builder -c "cd packaging/pacman && makepkg --nobuild --noprepare --skippgpcheck 2>&1 || true"
          echo "::notice::To install on Arch Linux, run from the project root:"
          echo "::notice::  git clone https://github.com/peekstore/tasklynx.git"
          echo "::notice::  cd tasklynx/packaging/pacman && makepkg -si"

  # ──────────────────────────────────────────────────────────────
  # 16. AI Reader (llms.txt) validation
  # ──────────────────────────────────────────────────────────────
  test-ai-reader:
    name: "AI Reader (llms.txt) validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs and Void theme
        run: pip install mkdocs mkdocs-void
      - name: Verify void doctor and AI reader generation
        run: |
          void doctor
          mkdocs build
          test -s site/llms.txt
          test -s site/llms-full.txt
          echo "✓ AI Reader files (llms.txt + llms-full.txt) successfully generated"
