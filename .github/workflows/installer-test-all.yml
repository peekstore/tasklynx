name: Installer Test All

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  macos-latest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  windows-latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.ps1
        shell: pwsh
        run: |
          $p = "$env:TEMP\tu$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          $env:USERPROFILE = $p
          .\installer.ps1
          $env:PATH = "$env:USERPROFILE\.config\peekstore\tasklynx\bin;$env:PATH"
          tasklynx --version
          tx --version

  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in Termux-like environment
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          TERMUX_VERSION=0.118 sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Test Nix
        run: nix --extra-experimental-features "nix-command flakes" run github:peekstore/tasklynx -- --version 2>&1 | tail -5 || true
