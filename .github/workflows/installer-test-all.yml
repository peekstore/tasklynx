name: Installer Test All

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Auto Build & Release"]
    types: [completed]
  pull_request:
  workflow_dispatch:

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Pick a published release tag
        id: v
        run: |
          set -e
          v=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            v="${{ github.event.workflow_run.head_branch }}"
          fi
          auth=(-H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json")
          if [ -z "$v" ] || ! curl -fsSL -o /dev/null "${auth[@]}" \
              "https://api.github.com/repos/peekstore/tasklynx/releases/tags/$v"; then
            v=$(curl -fsSL "${auth[@]}" \
              "https://api.github.com/repos/peekstore/tasklynx/releases?per_page=30" \
              | jq -r '[.[] | select(.draft == false)][0].tag_name // empty')
          fi
          if [ -z "$v" ]; then
            echo "No published release found" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Using release: $v"

  linux-x64:
    runs-on: ubuntu-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  macos-latest:
    runs-on: macos-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.sh
        run: |
          rm -rf ~/.config/peekstore/tasklynx
          sh ./installer.sh
          export PATH="$HOME/.config/peekstore/tasklynx/bin:$PATH"
          tasklynx --version
          tx --version

  windows-latest:
    runs-on: windows-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test installer.ps1
        shell: pwsh
        run: |
          $p = "$env:TEMP\tu$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $p | Out-Null
          $env:USERPROFILE = $p
          .\installer.ps1
          $env:PATH = "$env:USERPROFILE\.config\peekstore\tasklynx\bin;$env:PATH"
          tasklynx --version
          tx --version

  termux-abi:
    runs-on: ubuntu-latest
    needs: resolve
    env:
      TASKLYNX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android ABI selection and assets
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/fakebin"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            printf '#!/bin/sh\necho "%s"\n' "$abi" > "$RUNNER_TEMP/fakebin/getprop"
            chmod +x "$RUNNER_TEMP/fakebin/getprop"
            artifact=$(PATH="$RUNNER_TEMP/fakebin:$PATH" TERMUX_VERSION=1 DRY_RUN=1 \
              sh ./installer.sh | tail -1)
            echo "abi=$abi -> $artifact"
            test "$artifact" = "tasklynx-android-$abi"
            url="https://github.com/peekstore/tasklynx/releases/download/${TASKLYNX_VERSION}/$artifact"
            code=$(curl -o /dev/null -sIL -w '%{http_code}' "$url")
            echo "  $url [$code]"
            test "$code" = "200"
          done

  nixos:
    name: "Nix Flake"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check flake
        run: |
          nix --extra-experimental-features "nix-command flakes" flake check --no-build
      - name: Run from flake
        run: |
          nix --extra-experimental-features "nix-command flakes" \
            run . -- --version

  test-pipx:
    name: "pipx installation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipx
        run: python -m pip install --upgrade pip pipx
      - name: Install tasklynx via pipx
        run: |
          pipx install ./packaging/pipx --force
          tasklynx --version || true

  test-npm:
    name: "npm package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test npm package packing
        run: |
          cd packaging/npm
          npm pack --dry-run

  test-deb:
    name: "Debian/Ubuntu (.deb) install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary & .deb
        run: |
          cargo build --release
          VERSION=$(tr -d '[:space:]' < .version)
          ./packaging/debian/build_deb.sh "$VERSION" "amd64" "target/release/tasklynx" "."
      - name: Test dpkg installation
        run: |
          sudo dpkg -i tasklynx_*.deb
          tasklynx --version
          tx --version

  test-homebrew:
    name: "Homebrew formula"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Homebrew formula syntax
        run: |
          ruby -c Formula/tasklynx.rb
          ruby -c packaging/homebrew/tasklynx.rb
          brew audit --formula Formula/tasklynx.rb || true

  test-mise:
    name: "mise plugin"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Test mise plugin scripts
        run: |
          bash packaging/mise/bin/list-all | head -n 5 || true

  test-chocolatey:
    name: "Chocolatey packaging test"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack and validate nuspec
        shell: pwsh
        run: |
          cd packaging/chocolatey
          choco pack tasklynx.nuspec
          if (-not (Test-Path *.nupkg)) { throw "Chocolatey package was not created" }

  test-winget:
    name: "Winget manifests validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Winget YAML syntax and URLs
        run: |
          python3 -c '
          import os, glob, yaml
          yaml_files = glob.glob("packaging/winget/**/*.yaml", recursive=True)
          assert len(yaml_files) >= 4, f"Expected at least 4 winget manifests, found {len(yaml_files)}"
          for path in yaml_files:
              with open(path) as f:
                  data = yaml.safe_load(f)
              assert "PackageIdentifier" in data or "PackageVersion" in data, f"Missing required fields in {path}"
              print(f"✓ Validated {path}")
          '

  test-scoop:
    name: "Scoop manifests validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Scoop manifests JSON syntax
        run: |
          jq . packaging/scoop/tasklynx.json > /dev/null
          jq . bucket/tasklynx.json > /dev/null
          echo "✓ Scoop manifests valid JSON"

  test-arch-pacman:
    name: "Arch Pacman PKGBUILD validation"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pacman & makepkg
        run: |
          pacman -Syu --noconfirm base-devel git
          useradd -m builder
          chown -R builder:builder .
      - name: Validate PKGBUILD and .SRCINFO
        run: |
          su builder -c "cd packaging/pacman && makepkg --printsrcinfo > .SRCINFO.gen"
          diff -u packaging/pacman/.SRCINFO packaging/pacman/.SRCINFO.gen

  test-ai-reader:
    name: "AI Reader (llms.txt) validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs and Void theme
        run: pip install mkdocs mkdocs-void
      - name: Verify void doctor and AI reader generation
        run: |
          void doctor
          mkdocs build
          test -s site/llms.txt
          test -s site/llms-full.txt
          echo "✓ AI Reader files successfully generated"
