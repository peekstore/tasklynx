name: Auto Build & Release

env:
  PROJECT_NAME: tasklynx
  PUBLISHER_NAME: rkriad585
  PUBLISHER_EMAIL: rkriad585@gmail.com

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: "Prepare metadata"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch version + resolve metadata
        id: meta
        run: |
          VERSION=""
          if [ -f ".version" ]; then VERSION=$(cat .version | tr -d '[:space:]'); fi
          if [ -z "$VERSION" ]; then VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v${VERSION}"); else TAG="${GITHUB_REF#refs/tags/}"; fi
          COMMIT=$(git rev-parse --short=8 HEAD)
          if [[ "$TAG" == *"-"* ]]; then PRERELEASE="true"; else PRERELEASE="false"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.target }}"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: tasklynx-windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            artifact: tasklynx-windows-arm64.exe
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: tasklynx-linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: tasklynx-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: tasklynx-darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: tasklynx-darwin-arm64
          - target: aarch64-linux-android
            runner: ubuntu-latest
            artifact: tasklynx-linux-arm64
          - target: x86_64-linux-android
            runner: ubuntu-latest
            artifact: tasklynx-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Setup Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
        id: setup-ndk

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build with cross
        if: matrix.cross == true && !contains(matrix.target, 'android')
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: matrix.cross != true && !contains(matrix.target, 'android')
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Android (Termux)
        if: contains(matrix.target, 'android')
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/tasklynx.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/tasklynx" "dist/${{ matrix.artifact }}"
          fi

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum &>/dev/null; then sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"; else shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          retention-days: 1

  changelog:
    name: "Generate Changelog"
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.gen.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build notes
        id: gen
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          COMMIT="${{ needs.prepare.outputs.commit }}"
          {
            echo 'body<<EOF'
            echo "## tasklynx ${TAG}"
            echo ""
            echo "> Commit: \`${COMMIT}\` | Publisher: **${{ env.PUBLISHER_NAME }}** <${{ env.PUBLISHER_EMAIL }}>"
            echo ""
            echo "### Downloads"
            echo "| Platform | Architecture | File |"
            echo "|----------|-------------|------|"
            echo "| Windows | AMD64 | \`tasklynx-windows-amd64.exe\` |"
            echo "| Windows | ARM64 | \`tasklynx-windows-arm64.exe\` |"
            echo "| Linux | AMD64 | \`tasklynx-linux-amd64\` |"
            echo "| Linux | ARM64 | \`tasklynx-linux-arm64\` |"
            echo "| macOS | AMD64 (Intel) | \`tasklynx-darwin-amd64\` |"
            echo "| macOS | ARM64 (Apple Silicon) | \`tasklynx-darwin-arm64\` |"
            echo "| Android (Termux) | ARM64 | \`tasklynx-linux-arm64\` |"
            echo "| Android (Termux) | AMD64 | \`tasklynx-linux-amd64\` |"
            echo ""
            echo "### Verify Checksum"
            echo "\`\`\`bash"
            echo "sha256sum --check tasklynx-linux-amd64.sha256"
            echo "\`\`\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: "Publish Release"
    needs: [prepare, build, changelog]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten and checksum
        run: |
          mkdir -p final
          find dist -type f \( -name "*.exe" -o -name "tasklynx-*" \) -not -name "*.sha256" -exec cp {} final/ \;
          find dist -name "*.sha256" -exec cp {} final/ \;
          cd final && sha256sum * > SHA256SUMS.txt && ls -lh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "tasklynx ${{ needs.prepare.outputs.tag }}"
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          draft: false
          files: final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
