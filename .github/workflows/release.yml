name: Build Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: tasklynx-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: tasklynx-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: tasklynx-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            name: tasklynx-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: tasklynx-darwin-arm64
          - os: ubuntu-latest
            target: aarch64-linux-android
            name: tasklynx-android-arm64
          - os: ubuntu-latest
            target: x86_64-linux-android
            name: tasklynx-android-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Android target tools
        if: contains(matrix.target, 'android')
        uses: android-actions/setup-android@v3
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tasklynx" "dist/${{ matrix.name }}" 2>/dev/null || cp "target/${{ matrix.target }}/release/tasklynx.exe" "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with: { name: ${{ matrix.name }}, path: dist/* }
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
