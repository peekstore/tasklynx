name: Package & Distribute

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-pipx:
    name: "Test pipx installation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipx
        run: python -m pip install --upgrade pip pipx
      - name: Install tasklynx via pipx
        run: |
          pipx install ./packaging/pipx --force
          tasklynx --version || true

  test-mise:
    name: "Test mise plugin"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Test mise plugin scripts
        run: |
          bash packaging/mise/bin/list-all | head -n 5 || true

  build-deb:
    name: "Build Debian/Ubuntu (.deb) package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Build .deb
        run: |
          ./packaging/debian/build_deb.sh "0.0.1-beta-2" "amd64" "target/release/tasklynx" "."
      - name: Test .deb installation
        run: |
          sudo dpkg -i tasklynx_*.deb
          tasklynx --version
          tx --version
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasklynx-deb
          path: "*.deb"

  test-arch-pacman:
    name: "Validate Arch PKGBUILD"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pacman & makepkg
        run: |
          pacman -Syu --noconfirm base-devel git
          useradd -m builder
          chown -R builder:builder .
      - name: Validate PKGBUILD syntax
        run: |
          su builder -c "cd packaging/pacman && makepkg --printsrcinfo > .SRCINFO.check"

  publish-chocolatey:
    name: "Publish Chocolatey package"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Chocolatey package
        shell: pwsh
        run: |
          cd packaging/chocolatey
          choco pack tasklynx.nuspec
      - name: Upload choco nupkg
        uses: actions/upload-artifact@v4
        with:
          name: tasklynx-nupkg
          path: packaging/chocolatey/*.nupkg
      - name: Push to Chocolatey Community Repo
        if: startsWith(github.ref, 'refs/tags/v') && env.CHOCO_SECRET_KEY != ''
        env:
          CHOCO_SECRET_KEY: ${{ secrets.CHOCO_SECRET_KEY }}
        shell: pwsh
        run: |
          cd packaging/chocolatey
          $pkg = Get-ChildItem -Filter *.nupkg | Select-Object -First 1
          choco apiKey --key $env:CHOCO_SECRET_KEY --source https://push.chocolatey.org/
          choco push $pkg.FullName --source https://push.chocolatey.org/ --force

  publish-npm:
    name: "Publish to NPM"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Verify package
        run: |
          cd packaging/npm
          npm pack --dry-run
      - name: Publish to NPM registry
        if: startsWith(github.ref, 'refs/tags/v') && env.AUTH_KEY != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SCERET || secrets.NPM_SECRET }}
          AUTH_KEY: ${{ secrets.NPM_SCERET || secrets.NPM_SECRET }}
        run: |
          cd packaging/npm
          npm publish --access public
