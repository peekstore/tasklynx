name: Auto Version Sync & Tag

on:
  push:
    branches: [main]
    paths:
      - '.version'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target release version (leave blank to read from .version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-and-tag:
    name: "Sync Version & Push Tag"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve target version
        id: resolve
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            echo "$INPUT_VER" > .version
          fi
          VERSION=$(tr -d '[:space:]' < .version)
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target version: ${VERSION} (${TAG})"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Synchronize version across all manifests
        run: |
          chmod +x ./tools/sync_version.sh
          ./tools/sync_version.sh "${{ steps.resolve.outputs.version }}"

      - name: Commit manifest updates if changed
        id: commit
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            TAG="${{ steps.resolve.outputs.tag }}"
            git commit -m "chore(release): bump version to ${TAG} [skip ci]"
            git push origin HEAD:main
            echo "Committed and pushed version changes."
          fi

      - name: Create and push annotated tag
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote. Skipping creation."
          else
            echo "Creating annotated tag: $TAG"
            git tag -a "$TAG" -m "Tasklynx ${TAG}"
            git push origin "$TAG"
            echo "Successfully created and pushed tag $TAG!"
          fi
