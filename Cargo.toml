[package]
name = "tasklynx"
version = "0.0.1-beta-1"
edition = "2021"
rust-version = "1.75"
description = "A developer-first local task manager with Git-style workflows and a terminal-native dashboard."
license = "MIT"
authors = ["RK Riad Khan <rkriad585@gmail.com>"]
repository = "https://github.com/peekstore/tasklynx"
homepage = "https://peekstore.github.io/tasklynx"
documentation = "https://peekstore.github.io/tasklynx/"
readme = "README.md"
keywords = ["tasks", "todo", "kanban", "cli", "tui"]
categories = ["command-line-utilities", "productivity"]
exclude = ["/site", "/Screenshots", "/Tasklynx-logos", "/docs", "/.github"]
build = "build.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = "0.29"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
