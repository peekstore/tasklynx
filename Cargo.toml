[package]
name = "tasklynx"
version = "0.0.1-beta-1"
edition = "2021"
description = "A developer-first local task manager with Git-style workflows and a terminal-native dashboard."
license = "MIT"
repository = "https://github.com/rkriad585/tasklynx"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
