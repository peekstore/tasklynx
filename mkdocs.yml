site_name: Tasklynx
site_description: Developer-first local task manager
site_url: https://peekstore.github.io/tasklynx/
repo_url: https://github.com/peekstore/tasklynx
theme:
  name: material
  palette:
    scheme: slate
    primary: red
    accent: red
  logo: logo.svg
  favicon: logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - Configuration: configuration.md
  - Development: development.md
