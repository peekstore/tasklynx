site_name: Tasklynx
site_description: Developer-first local task manager
site_author: RK Riad Khan
site_url: https://peekstore.github.io/tasklynx/
repo_url: https://github.com/peekstore/tasklynx
copyright: Copyright &copy; 2026 RK Riad Khan
theme:
  name: void
  logo: logo.svg
  favicon: logo.svg
  palette:
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  void:
    ai_reader:
      enabled: true
      markup: true
      url_style: sidecar
      auto_title: true
      llms: true
      llms_full: true
      sitemap: true
extra_css:
  - stylesheets/extra.css
extra:
  void_version: 1
  void_logo_dark: assets/icon-on-dark-mode.svg
  void_logo_light: assets/icon-on-light-mode.svg
  void_favicon_dark: assets/favicon-on-dark-mode.svg
  void_favicon_light: assets/favicon-on-light-mode.svg
plugins:
  - search
  - void
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - CLI Reference: cli.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Development: development.md
  - Deployment: deployment.md
  - Screenshots: screenshots.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
