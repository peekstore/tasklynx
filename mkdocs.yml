site_name: Tasklynx
site_description: Developer-first local task manager
site_url: https://peekstore.github.io/tasklynx/
repo_url: https://github.com/peekstore/tasklynx
theme:
  name: void
  logo: logo.svg
  favicon: logo.svg
extra_css:
  - stylesheets/extra.css
extra:
  void_logo_dark: assets/icon-on-dark-mode.svg
  void_logo_light: assets/icon-on-light-mode.svg
  void_favicon_dark: assets/favicon-on-dark-mode.svg
  void_favicon_light: assets/favicon-on-light-mode.svg
plugins:
  - search
  - void
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - CLI Reference: cli.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Development: development.md
  - Deployment: deployment.md
  - Screenshots: screenshots.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
