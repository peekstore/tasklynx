site_name: Tasklynx
site_description: Developer-first local task manager
site_url: https://peekstore.github.io/tasklynx/
repo_url: https://github.com/peekstore/tasklynx
theme:
  name: void
  logo: logo.svg
  favicon: logo.svg
plugins:
  - search
  - void
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - Configuration: configuration.md
  - Development: development.md
